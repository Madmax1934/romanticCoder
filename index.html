<!DOCTYPE html>
<html>
<head>
  <title>For You ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }

    /* Background photo */
    .bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url("b6e28107-4681-4b1b-828e-7f78e4073ab4.jpg") center/cover no-repeat;
      animation: slowZoom 40s ease-in-out infinite;
      filter: blur(2px) brightness(0.7);
      z-index: -1;
    }

    @keyframes slowZoom {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .content {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      padding: 20px;
    }

    #text {
      font-size: 22px;
      max-width: 320px;
      line-height: 1.6;
      margin-bottom: 25px;
      min-height: 120px;
    }

    button {
      background: #ff4d6d;
      border: none;
      color: white;
      padding: 12px 26px;
      border-radius: 30px;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="bg"></div>

<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="content">
  <div id="text">Hey ❤️</div>
  <button id="startBtn" onclick="start()">Tap here ❤️</button>
</div>

<script>
  const lines = [
    "I made this just for you",
    "Because you mean more to me than you know",
    "You turned ordinary days into beautiful memories",
    "You are my comfort my happiness my home",
    "I can’t imagine my future without you",
    "So I love you more than words can say 💍❤️"
  ];

  const textEl = document.getElementById("text");
  const music = document.getElementById("bgMusic");
  const button = document.getElementById("startBtn");

  let lineIndex = 0;

  function typeLine(line, callback) {
    textEl.innerText = "";
    const words = line.split(" ");
    let i = 0;

    const interval = setInterval(() => {
      textEl.innerText += words[i] + " ";
      i++;

      if (i >= words.length) {
        clearInterval(interval);
        setTimeout(callback, 1500); // pause between lines
      }
    }, line.includes("love") ? 600 : 350);
  }

  function playLyrics() {
    if (lineIndex < lines.length) {
      typeLine(lines[lineIndex], () => {
        lineIndex++;
        playLyrics();
      });
    }
  }

  function start() {
    music.play();
    button.style.display = "none";
    playLyrics();
  }
</script>

</body>
</html>
